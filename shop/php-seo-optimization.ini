; ===================================================================
; SEO OPTIMIZATION & PERFORMANCE PHP CONFIGURATION
; ===================================================================
; Place this in your Apache config or server PHP initialization
; Or add these settings to your php.ini file

; ===================================================================
; 1. OPCODE CACHING (OPcache) - CRITICAL FOR PERFORMANCE
; ===================================================================
; OPcache caches the compiled PHP code, significantly improving performance

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.max_wasted_percentage=10
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.fast_shutdown=1
opcache.file_cache=/tmp/php-opcache
opcache.file_cache_only=0

; ===================================================================
; 2. COMPRESSION - REDUCE BANDWIDTH
; ===================================================================
; Enable output compression for faster transmission
zlib.output_compression=On
zlib.output_compression_level=6

; ===================================================================
; 3. ERROR HANDLING & LOGGING
; ===================================================================
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/var/log/php/error.log
error_reporting=E_ALL & ~E_NOTICE & ~E_WARNING

; ===================================================================
; 4. MEMORY & PERFORMANCE
; ===================================================================
memory_limit=256M
max_execution_time=300
max_input_time=60
post_max_size=10M
upload_max_filesize=10M
default_socket_timeout=60

; ===================================================================
; 5. SESSION MANAGEMENT
; ===================================================================
session.gc_maxlifetime=1440
session.gc_probability=1
session.gc_divisor=100
session.use_trans_sid=0
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Strict

; ===================================================================
; 6. PERFORMANCE & OPTIMIZATION
; ===================================================================
realpath_cache_size=4096k
realpath_cache_ttl=600

; ===================================================================
; 7. SECURITY
; ===================================================================
expose_php=Off
allow_url_fopen=Off
allow_url_include=Off
disable_functions=exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; ===================================================================
; 8. DATE & TIME
; ===================================================================
date.timezone=America/Los_Angeles
