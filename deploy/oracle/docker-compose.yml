services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swapnopay_gateway
      POSTGRES_USER: swapnopay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - gateway_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapnopay -d swapnopay_gateway"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  gateway:
    build:
      context: ../../gateway-service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://swapnopay:${POSTGRES_PASSWORD}@postgres:5432/swapnopay_gateway
      DATABASE_SSL: "false"
      PORT: "8080"
      TRUST_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../web:/srv/web:ro
      - ../../admin/dist:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    networks: [private]

networks:
  private:

volumes:
  gateway_postgres:
  caddy_data:
  caddy_config:
