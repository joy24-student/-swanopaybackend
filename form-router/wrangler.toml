name = "swapnopay-form-router"
main = "src/index.js"
compatibility_date = "2026-08-28"
workers_dev = false

[vars]
PUBLIC_ORIGIN = "https://forms.swapnopay.top"

[[routes]]
pattern = "forms.swapnopay.top"
custom_domain = true

[[kv_namespaces]]
binding = "FORM_ROUTES"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"
