name: SwapnoPay Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Build & Verify Android Application
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      continue-on-error: true # Safe fallback if wrapper is not version controlled yet

    - name: Build Debug Application
      run: ./gradlew assembleDebug --no-daemon

  # Job 2: Validate Serverless Edge Functions
  validate-deno:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Deno Environment
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.35.x

    - name: Lint and Format verification
      run: |
        deno lint supabase/functions/
        deno fmt --check supabase/functions/
      continue-on-error: true # Warnings only
