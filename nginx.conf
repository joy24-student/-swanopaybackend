server {
    listen 80;
    server_name pay.swapnopay.top swapnopay.top localhost _;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html widget.html docs.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Hosted Form Dynamic Routes (/f/* or /forms/*)
    location ~* ^/(f|forms|form)/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        try_files $uri /form.html?$args;
    }

    # Public aliases use the same canonical URLs as the HTML metadata.
    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /$is_args$args; }
    location = /docs { return 301 /docs.html$is_args$args; }
    location = /portal { return 301 /portal.html$is_args$args; }
    location = /widget { try_files /widget.html =404; }
    location = /form { try_files /form.html =404; }

    # Static Web Assets (with public CORS headers for widget embeds)
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Webhook-Secret" always;
        try_files $uri $uri/ =404;
    }

    # Proxy Uploaded Media Assets (/uploads/*)
    location /uploads/ {
        proxy_pass http://swapnopay-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy SwapnoPay Backend API (/v1/*)
    location /v1/ {
        proxy_pass http://swapnopay-backend:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io WebSockets (/socket.io/)
    location /socket.io/ {
        proxy_pass http://swapnopay-backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend Health Check (/healthz)
    location /healthz {
        proxy_pass http://swapnopay-backend:4000/healthz;
    }
}
